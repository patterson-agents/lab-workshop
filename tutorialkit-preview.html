<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TutorialKit Preview · TechDays: AI Fluency - Agentic Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_ds/patterson-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/icons.css" />
<link rel="stylesheet" href="tutorialkit/theme.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--tk-font-sans);
  font-size: 14px;
  line-height: 1.55;
  background: var(--tk-background-primary);
  color: var(--tk-text-body);
  overflow: hidden;
}
#tk-root { height: 100%; display: flex; flex-direction: column; }

/* ============ Top bar ============ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; height: 52px; flex: 0 0 52px;
  border-bottom: 1px solid var(--tk-border-primary);
  background: var(--tk-background-primary);
}
.topbar .brand { display: flex; align-items: center; gap: 14px; }
.topbar .brand .brand-logo { height: 22px; width: auto; display: block; }
.topbar .brand .mark {
  font-family: var(--tk-font-sans); font-weight: 700;
  font-size: 19px; color: var(--tk-text-heading);
}
.topbar .brand .mark em { color: var(--tk-text-accent); font-style: normal; font-weight: 700; }
.topbar .brand .series {
  font-family: var(--tk-font-mono); font-size: 10px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--tk-text-secondary);
}
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--tk-font-mono); font-size: 11px; letter-spacing: .08em;
  color: var(--tk-text-secondary); background: transparent;
  border: 1px solid var(--tk-border-primary); padding: 6px 12px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--tk-text-primary); border-color: var(--tk-border-brighter); }

/* ============ Main split ============ */
.main { flex: 1; display: grid; grid-template-columns: minmax(440px, 44%) 1fr; min-height: 0; }

/* ============ Lesson pane ============ */
.lesson-pane {
  display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--tk-border-primary);
  background: var(--tk-background-primary);
}
.lesson-nav { display: flex; align-items: center; gap: 8px; padding: 12px 18px; flex: 0 0 auto; }
.nav-arrow {
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--tk-border-primary); background: transparent;
  color: var(--tk-text-secondary); cursor: pointer; font-size: 14px; flex: 0 0 auto;
  transition: color .15s, border-color .15s;
}
.nav-arrow:hover:not(:disabled) { color: var(--tk-text-primary); border-color: var(--tk-border-brighter); }
.nav-arrow:disabled { opacity: .35; cursor: default; }
.bc-wrap { flex: 1; position: relative; min-width: 0; }
.breadcrumb {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 1px solid var(--tk-border-primary); background: var(--tk-background-secondary);
  padding: 7px 12px; font-family: var(--tk-font-mono); font-size: 11.5px;
  letter-spacing: .04em; color: var(--tk-text-secondary); cursor: pointer;
  user-select: none;
}
.breadcrumb:hover, .breadcrumb.open { border-color: var(--tk-border-brighter); }
.breadcrumb .crumbs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb .crumbs strong { color: var(--tk-text-primary); font-weight: 500; }
.breadcrumb .chev { color: var(--tk-text-disabled); }
.bc-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
  max-height: 420px; overflow-y: auto;
  border: 1px solid var(--tk-border-brighter); background: var(--tk-background-primary);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
}
.bc-part {
  font-family: var(--tk-font-mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--tk-text-accent);
  padding: 10px 14px 4px; border-top: 1px solid var(--tk-border-primary);
}
.bc-part:first-child { border-top: none; }
.bc-item {
  padding: 6px 14px 6px 22px; font-size: 13px; color: var(--tk-text-secondary); cursor: pointer;
}
.bc-item:hover { color: var(--tk-text-primary); background: var(--tk-background-active); }
.bc-item.active { color: var(--tk-text-accent); background: var(--tk-background-active); }

.lesson-scroll { flex: 1; overflow-y: auto; padding: 14px 34px 48px; }
.lesson-scroll .part-label {
  font-family: var(--tk-font-mono); font-size: 10.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--tk-text-accent);
  display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 10px;
}
.lesson-scroll .part-label::before { content: ""; width: 22px; height: 1.5px; background: var(--tk-text-accent); }
.lesson-scroll h1 {
  font-family: var(--tk-font-sans); font-weight: 700; font-size: 33px; line-height: 1.1;
  letter-spacing: -0.02em; color: var(--tk-text-heading); margin: 0 0 16px;
}
.lesson-scroll h2 {
  font-family: var(--tk-font-sans); font-weight: 700; font-size: 21px;
  letter-spacing: -0.01em; color: var(--tk-text-heading); margin: 30px 0 10px;
}
.lesson-scroll p { margin: 0 0 12px; max-width: 70ch; }
.lesson-scroll ul, .lesson-scroll ol { margin: 0 0 14px 20px; }
.lesson-scroll li { margin-bottom: 6px; }
.lesson-scroll strong { color: var(--tk-text-primary); }
.lesson-scroll a { color: var(--tk-text-accent); }
.lesson-scroll blockquote {
  border-left: 3px solid var(--tk-border-accent); padding: 2px 0 2px 14px;
  color: var(--tk-text-secondary); margin: 0 0 12px;
}
.lesson-scroll blockquote p { margin-bottom: 4px; }
.lesson-scroll code {
  font-family: var(--tk-font-mono); font-size: .87em;
  background: var(--tk-background-active); border: 1px solid var(--tk-border-primary);
  padding: 1px 5px; border-radius: 2px; color: var(--tk-text-primary);
}
.lesson-scroll pre {
  background: var(--tk-background-secondary); border: 1px solid var(--tk-border-primary);
  padding: 13px 16px; margin: 0 0 14px; overflow-x: auto;
}
.lesson-scroll pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; color: var(--tk-text-primary); }
.lesson-scroll table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 12.5px; }
.lesson-scroll th {
  font-family: var(--tk-font-mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tk-text-secondary); text-align: left;
  border-bottom: 1.5px solid var(--tk-border-brighter); padding: 6px 10px 6px 0;
}
.lesson-scroll td { border-bottom: 1px solid var(--tk-border-primary); padding: 7px 10px 7px 0; vertical-align: top; }
.pre-label {
  font-family: var(--tk-font-mono); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--tk-text-disabled);
  border: 1px solid var(--tk-border-primary); border-bottom: none;
  display: inline-block; padding: 4px 10px 3px; background: var(--tk-background-secondary);
}
.pre-label + pre { margin-top: 0; }
.tok-c { color: var(--tk-text-disabled); }
.tok-k { color: var(--tk-text-accent); }
.tok-s { color: var(--tk-text-tip); }

/* Callouts */
.callout { border: 1px solid; padding: 13px 16px; margin: 0 0 14px; font-size: 13.5px; }
.callout .co-title {
  font-family: var(--tk-font-mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; display: block; margin-bottom: 6px;
}
.callout p:last-child { margin-bottom: 0; }
.callout.info, .callout.tip { background: var(--tk-background-info); border-color: var(--tk-border-info); }
.callout.info .co-title, .callout.tip .co-title { color: var(--tk-text-info); }
.callout.tip { background: var(--tk-background-tip); border-color: var(--tk-border-tip); }
.callout.tip .co-title { color: var(--tk-text-tip); }
.callout.warn { background: var(--tk-background-warning); border-color: var(--tk-border-warning); }
.callout.warn .co-title { color: var(--tk-text-warning); }
.callout.danger { background: var(--tk-background-negative); border-color: var(--tk-border-negative); }
.callout.danger .co-title { color: var(--tk-text-negative); }
.callout.success { background: var(--tk-background-positive); border-color: var(--tk-border-positive); }
.callout.success .co-title { color: var(--tk-text-positive); }

/* prev/next cards */
.lesson-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 36px; }
.lesson-card {
  border: 1px solid var(--tk-border-primary); background: var(--tk-background-secondary);
  padding: 14px 16px; text-decoration: none; color: var(--tk-text-secondary);
  transition: border-color .15s; cursor: pointer;
}
.lesson-card:hover { border-color: var(--tk-border-accent); }
.lesson-card .dir {
  font-family: var(--tk-font-mono); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--tk-text-disabled); display: block; margin-bottom: 6px;
}
.lesson-card .nm { font-family: var(--tk-font-sans); font-weight: 700; font-size: 16px; color: var(--tk-text-heading); }
.lesson-card.next { text-align: right; }

/* ============ Workspace ============ */
.workspace { display: flex; flex-direction: column; min-height: 0; background: var(--tk-background-secondary); }
.ws-top { flex: 1 1 58%; display: grid; grid-template-columns: 240px 1fr; min-height: 0; border-bottom: 1px solid var(--tk-border-primary); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  height: 36px; padding: 0 12px; border-bottom: 1px solid var(--tk-border-primary);
  font-family: var(--tk-font-mono); font-size: 10.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--tk-text-secondary);
  background: var(--tk-background-primary); flex: 0 0 36px; overflow: hidden; white-space: nowrap;
}
.file-tree { display: flex; flex-direction: column; border-right: 1px solid var(--tk-border-primary); min-height: 0; }
.file-tree .tree { padding: 8px 0; overflow-y: auto; font-family: var(--tk-font-mono); font-size: 12px; }
.file-tree .entry {
  display: flex; align-items: center; gap: 7px; padding: 4px 12px;
  color: var(--tk-text-secondary); white-space: nowrap; cursor: pointer;
}
.file-tree .entry:hover { color: var(--tk-text-primary); }
.file-tree .entry.dir::before { font-family: 'patterson-icons'; content: "\e905"; font-size: 9px; color: var(--tk-text-disabled); }
.file-tree .entry.file::before { font-family: 'patterson-icons'; content: "\e926"; font-size: 9px; color: var(--tk-text-disabled); }
.file-tree .entry.active { color: var(--tk-text-accent); background: var(--tk-background-active); }
.file-tree .d1 { padding-left: 24px; }
.file-tree .d2 { padding-left: 36px; }
.file-tree .d3 { padding-left: 48px; }

.editor { display: flex; flex-direction: column; min-height: 0; }
.editor .code {
  flex: 1; overflow: auto; padding: 12px 0;
  font-family: var(--tk-font-mono); font-size: 12.5px; line-height: 1.65;
  background: var(--tk-background-secondary);
}
.editor .ln { display: flex; }
.editor .ln .no { flex: 0 0 44px; text-align: right; padding-right: 14px; color: var(--tk-text-disabled); user-select: none; }
.editor .ln .tx { white-space: pre; color: var(--tk-text-primary); }
.editor-empty {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--tk-font-mono); font-size: 12px; line-height: 1.8;
  color: var(--tk-text-disabled); padding: 24px;
}

/* ============ Terminal ============ */
.terminal { flex: 1 1 42%; display: flex; flex-direction: column; min-height: 0; }
.term-body {
  flex: 1; overflow-y: auto; padding: 12px 16px; cursor: text;
  font-family: var(--tk-font-mono); font-size: 12.5px; line-height: 1.7;
  background: var(--tk-background-primary); color: var(--tk-terminal-foreground);
}
.term-body .prompt { color: var(--tk-terminal-green); }
.term-body .cmd { color: var(--tk-terminal-foreground); }
.term-body .dim { color: var(--tk-terminal-brightBlack); white-space: pre-wrap; }
.term-body .blue { color: var(--tk-terminal-blue); }
.term-body .warn-t { color: var(--tk-terminal-yellow); }
.term-line { display: flex; align-items: baseline; }
.term-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: var(--tk-font-mono); font-size: 12.5px;
  color: var(--tk-terminal-foreground); caret-color: var(--tk-terminal-foreground);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--tk-border-brighter); }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .lesson-pane { border-right: none; border-bottom: 1px solid var(--tk-border-primary); }
}
</style>
</head>
<body>
<div id="tk-root"></div>

<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="tk-app/manifest.js"></script>
<script src="tk-app/md.js"></script>
